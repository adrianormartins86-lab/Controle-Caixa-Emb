# Tema Molicenter - azul, branco e magenta
# Este arquivo PODE ir pro GitHub (diferente do secrets.toml)
[theme]
primaryColor = "#E6007E"            # magenta (botoes primarios, radio, foco)
backgroundColor = "#FFFFFF"          # fundo branco
secondaryBackgroundColor = "#EEF3FB" # azul bem claro (inputs, expanders)
textColor = "#12274E"                # azul-escuro para texto
font = "sans serif"

[server]
enableStaticServing = true  # libera a pasta "static/" (ícones e manifest do app instalável)
