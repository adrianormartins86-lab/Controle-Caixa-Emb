<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0B3D91">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Caixa EMB</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css?v=1.3.0">
</head>
<body>
  <!-- ===================== LOGIN ===================== -->
  <section id="tela-login" class="tela-login" hidden>
    <div class="login-cartao">
      <img src="icons/logo.png" alt="" class="login-logo">
      <h1>Gerenciamento de Caixa</h1>
      <p class="sub">Lançamento de pedidos</p>

      <label class="campo">
        <span>Usuário</span>
        <select id="login-usuario"><option value="">Escolha...</option></select>
      </label>
      <label class="campo">
        <span>Senha</span>
        <!-- type="text" + máscara via CSS: o Chrome/Brave não oferece salvar/gerar senha -->
        <input id="login-senha" type="text" class="senha" autocomplete="off" autocapitalize="off"
               autocorrect="off" spellcheck="false" data-lpignore="true" data-form-type="other">
      </label>
      <p id="login-erro" class="erro" hidden></p>
      <button id="btn-entrar" class="btn btn-primario btn-grande">Entrar</button>
      <p class="versao" id="versao-login"></p>
    </div>
  </section>

  <!-- ===================== APP ===================== -->
  <div id="app" hidden>
    <header class="topo">
      <button id="btn-voltar" class="btn-voltar" aria-label="Voltar" hidden>‹</button>
      <img src="icons/logo.png" alt="" class="topo-logo" id="topo-logo">
      <div class="topo-titulo">
        <strong id="topo-titulo">Novo pedido</strong>
        <small id="topo-usuario"></small>
      </div>
      <button id="btn-sair" class="btn-icone" aria-label="Sair">Sair</button>
    </header>

    <main id="conteudo">
      <!-- ---------- LANÇAR ---------- -->
      <section id="pg-lancar" class="pagina">
        <div class="cartao">
          <button id="btn-cliente" class="seletor">
            <span class="seletor-rotulo">Cliente</span>
            <span id="cliente-valor" class="seletor-valor vazio">Escolha...</span>
            <span class="seta">›</span>
          </button>
          <p id="aviso-trava" class="dica" hidden>🔒 Cliente travado enquanto houver itens novos. Limpe os itens para trocar.</p>

          <div class="linha-2">
            <label class="campo">
              <span>Data</span>
              <input id="lanc-data" type="date">
            </label>
            <label class="campo">
              <span>Missão</span>
              <select id="lanc-missao"></select>
            </label>
          </div>

          <div id="info-comanda" class="info-comanda" hidden></div>
        </div>

        <h2 class="titulo-secao">Produtos</h2>
        <div class="busca-wrap">
          <input id="busca-produto" type="search" placeholder="Buscar produto..." enterkeyhint="search" autocomplete="off">
        </div>
        <div id="grade-produtos" class="grade-produtos"></div>

        <h2 class="titulo-secao" id="titulo-itens" hidden>Itens novos</h2>
        <div id="lista-carrinho" class="lista-itens"></div>

        <div id="bloco-obs" hidden>
          <label class="campo">
            <span>Observação do pedido (opcional)</span>
            <input id="lanc-obs" type="text" placeholder="Ex.: pagar na sexta, mesa 3..." autocomplete="off">
          </label>
          <button id="btn-limpar" class="btn btn-texto">Limpar itens novos</button>
        </div>
        <div class="espaco-rodape"></div>
      </section>

      <!-- ---------- COMANDAS ---------- -->
      <section id="pg-comandas" class="pagina" hidden>
        <div id="lista-comandas"></div>
      </section>

      <!-- ---------- HOJE ---------- -->
      <section id="pg-hoje" class="pagina" hidden>
        <div class="cartao">
          <label class="campo">
            <span>Dia</span>
            <input id="hoje-data" type="date">
          </label>
        </div>
        <div id="resumo-dia"></div>
      </section>

      <!-- ---------- CONFIGURAÇÕES (só admin) ---------- -->
      <section id="pg-config" class="pagina" hidden>
        <div class="segmentos" id="cfg-abas">
          <button data-cfg="produtos" class="sel">Produtos</button>
          <button data-cfg="missoes">Missões</button>
          <button data-cfg="clientes">Clientes</button>
        </div>
        <div class="busca-wrap"><input id="cfg-busca" type="search" placeholder="Buscar..." autocomplete="off" enterkeyhint="search"></div>
        <button id="cfg-novo" class="btn btn-primario btn-bloco" style="margin-top:10px">➕ Novo produto</button>
        <div id="cfg-lista" class="cfg-lista"></div>
      </section>

      <!-- ---------- MAIS (só admin) ---------- -->
      <section id="pg-mais" class="pagina" hidden>
        <h2 class="titulo-secao" style="margin-top:4px">Financeiro</h2>
        <div class="menu-mais">
          <button data-ir="extrato"><span class="mm-ic">📋</span><span class="mm-txt"><strong>Extrato</strong><small>Pedidos do período, editar e excluir</small></span><span class="seta">›</span></button>
          <button data-ir="pendentes"><span class="mm-ic">💰</span><span class="mm-txt"><strong>Pgtos. pendentes</strong><small>Receber e liquidar por valor</small></span><span class="seta">›</span></button>
          <button data-ir="cobranca"><span class="mm-ic">📱</span><span class="mm-txt"><strong>Gerar cobrança</strong><small>Mensagem de WhatsApp com Pix</small></span><span class="seta">›</span></button>
          <button data-ir="abatimentos"><span class="mm-ic">🔄</span><span class="mm-txt"><strong>Abatimento / Reembolso</strong><small>Crédito direto no cliente, fora do caixa</small></span><span class="seta">›</span></button>
          <button data-ir="despesas"><span class="mm-ic">💸</span><span class="mm-txt"><strong>Despesas</strong><small>Saídas de caixa: compras, contas...</small></span><span class="seta">›</span></button>
        </div>
        <h2 class="titulo-secao">Relatórios</h2>
        <div class="menu-mais">
          <button data-ir="fechamento"><span class="mm-ic">📑</span><span class="mm-txt"><strong>Fechamento</strong><small>Formas, produtos, missões, quem pagou e quem deve + PDF</small></span><span class="seta">›</span></button>
          <button data-ir="resumocli"><span class="mm-ic">📊</span><span class="mm-txt"><strong>Resumo por cliente</strong><small>Total, pago e devendo de cada cliente</small></span><span class="seta">›</span></button>
          <button data-ir="resumoprod"><span class="mm-ic">📦</span><span class="mm-txt"><strong>Resumo por produto</strong><small>Quanto vendeu de cada produto + PDF</small></span><span class="seta">›</span></button>
        </div>
        <h2 class="titulo-secao">Cadastros</h2>
        <div class="menu-mais">
          <button data-ir="config"><span class="mm-ic">⚙️</span><span class="mm-txt"><strong>Configurações</strong><small>Produtos, missões e clientes</small></span><span class="seta">›</span></button>
          <button data-ir="pix"><span class="mm-ic">🔑</span><span class="mm-txt"><strong>Chave Pix</strong><small>Usada na mensagem de cobrança</small></span><span class="seta">›</span></button>
          <button data-ir="usuarios" id="mm-usuarios" hidden><span class="mm-ic">👤</span><span class="mm-txt"><strong>Usuários</strong><small>Criar, inativar e resetar senha</small></span><span class="seta">›</span></button>
        </div>
      </section>

      <!-- ---------- EXTRATO (só admin) ---------- -->
      <section id="pg-extrato" class="pagina" hidden>
        <div id="filtros-extrato"></div>
        <div id="extrato-conteudo"></div>
      </section>

      <!-- ---------- PAGAMENTOS PENDENTES (só admin) ---------- -->
      <section id="pg-pendentes" class="pagina" hidden>
        <div id="filtros-pendentes"></div>
        <div id="pendentes-conteudo"></div>
      </section>

      <!-- ---------- ABATIMENTO / DESPESAS / PIX / USUÁRIOS (só admin) ---------- -->
      <section id="pg-abatimentos" class="pagina" hidden><div id="abatimentos-conteudo"></div></section>
      <section id="pg-despesas" class="pagina" hidden><div id="despesas-conteudo"></div></section>
      <section id="pg-pix" class="pagina" hidden><div id="pix-conteudo"></div></section>
      <section id="pg-usuarios" class="pagina" hidden><div id="usuarios-conteudo"></div></section>

      <!-- ---------- RELATÓRIOS (só admin) ---------- -->
      <section id="pg-fechamento" class="pagina" hidden>
        <div id="filtros-fechamento"></div>
        <div id="fechamento-conteudo"></div>
      </section>
      <section id="pg-resumocli" class="pagina" hidden>
        <div id="filtros-resumocli"></div>
        <div id="resumocli-conteudo"></div>
      </section>
      <section id="pg-resumoprod" class="pagina" hidden>
        <div id="filtros-resumoprod"></div>
        <div id="resumoprod-conteudo"></div>
      </section>

      <!-- ---------- GERAR COBRANÇA (só admin) ---------- -->
      <section id="pg-cobranca" class="pagina" hidden>
        <p class="dica" style="margin-top:0">Pendências de todos os dias. Toque no cliente para montar a mensagem.</p>
        <div class="busca-wrap"><input id="cob-busca" type="search" placeholder="Buscar cliente..." autocomplete="off" enterkeyhint="search"></div>
        <div id="cobranca-conteudo"></div>
      </section>
    </main>

    <!-- barra do total (só na tela Lançar) -->
    <div id="barra-total" class="barra-total" hidden>
      <div class="barra-total-valor">
        <small id="barra-rotulo">Total do pedido</small>
        <strong id="barra-valor">R$ 0,00</strong>
      </div>
      <button id="btn-guardar" class="btn btn-secundario">Guardar</button>
      <button id="btn-fechar" class="btn btn-primario">Fechar e pagar</button>
    </div>

    <nav class="abas">
      <button data-pg="lancar" class="aba ativa"><span class="aba-ic">🧾</span>Lançar</button>
      <button data-pg="comandas" class="aba"><span class="aba-ic">🗂️</span>Comandas<b id="badge-comandas" class="badge" hidden></b></button>
      <button data-pg="hoje" class="aba"><span class="aba-ic">📊</span>Hoje</button>
      <button data-pg="mais" class="aba" id="aba-mais" hidden><span class="aba-ic">☰</span>Mais</button>
    </nav>
  </div>

  <!-- ===================== GAVETA (bottom sheet) ===================== -->
  <div id="veu" class="veu" hidden></div>
  <div id="gaveta" class="gaveta" hidden role="dialog" aria-modal="true">
    <div class="gaveta-alca"></div>
    <div id="gaveta-conteudo"></div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <div id="carregando" class="carregando" hidden><div class="spinner"></div></div>

  <script src="config.js"></script>
  <script src="app.js?v=1.3.0"></script>
  <script src="admin.js?v=1.3.0"></script>
  <script src="relatorios.js?v=1.3.0"></script>
  <script src="cadastros.js?v=1.3.0"></script>
</body>
</html>
